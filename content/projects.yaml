# Project cards, shown in this order.
#   image: a file in public/, e.g. /projects/my-app.jpg (its size is read automatically)
#   video: optional trailer with a poster image and one or more sources
#   links[].icon: one of the names in lib/icons.ts, e.g. github, steam, youtube, link

- title: PSN README Card
  description: >-
    A live PlayStation Network trophy card for GitHub profiles. A small
    serverless function on Vercel renders trophy level, trophy counts, PS Plus
    status, and recent games as an SVG that READMEs embed like any image.
  tags: [TypeScript, Serverless, Vercel, SVG]
  image: /projects/psn-readme-card.svg
  links:
    - icon: github
      url: https://github.com/Jacob-SouthernCity/psn-readme-card
      label: View on GitHub

- title: Kazumi TV
  description: >-
    An Android TV and Google TV port of the open-source Kazumi anime app. Adds
    full remote-control focus navigation, D-pad browsing of comments, a TV
    launcher banner, and network fallbacks, while leaving phone and desktop
    behaviour unchanged.
  tags: [Flutter, Dart, Android TV, Open Source]
  image: /projects/kazumi-tv.jpg
  links:
    - icon: github
      url: https://github.com/Jacob-SouthernCity/Kazumi-TV
      label: View on GitHub

