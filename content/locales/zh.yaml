# Simplified Chinese translations, shown at /zh.
# Only translated fields live here; anything missing falls back to the English content.
# Keys are ids from the English files (project and skill groups use their English title).
# The build fails if a key no longer exists in the English content.
# Keep each text on one line: YAML's folded blocks (>-) put spaces between lines.

profile:
  nameVersionLabels: [法定姓名, 英文名, 中文名, 日文名]
  titles: [软件工程师, 游戏开发者, 旅行者]
  bio: "**Smule** 软件工程师，工作横跨 Web、移动端和平台。拥有**耶鲁大学计算机科学**硕士学位，本科就读于南加州大学，主修**游戏开发与数学**。我喜欢打造真正有人在用的产品，注重用户体验和性能。"

experience:
  smule:
    title: 软件工程师
    description: "全职工程师，参与 Smule 的各条产品线：为 smule.com 网页端以及 iOS 和 Android 上的Smule Sing 应用开发功能，并支持其背后的后端服务。"
  smule-intern:
    title: 机器学习工程师实习生
    description: 以机器学习工程实习生的身份加入 Smule，之后转为全职软件工程师。
  vestmark:
    title: 助理软件工程师
    location: 马萨诸塞州韦克菲尔德
    description: 为 Vestmark 的财富管理平台 VestmarkONE 开发投资组合再平衡及相关功能的后端 API。
  yale:
    title: 计算机科学硕士
    organization: 耶鲁大学
    shortName: 耶鲁
    location: 康涅狄格州纽黑文
    description: 修读分布式系统构建、数据库系统、全栈 Web 编程和用户界面设计等课程。
  ebaotech:
    title: 软件工程师实习生
    organization: 易保网络技术
    shortName: 易保
    location: 上海
    description: "设计了基于大语言模型的编程语言翻译流程。使用 PyTorch 和 Hugging Face 微调 ChatGLM v2 等模型，搭建保险数据库，并在 AWS SageMaker 上训练模型。"
  nplace:
    title: 软件工程师实习生
    location: 上海
    description: "为数据传感器转换器开发自适应降采样，在保证精度的同时降低线程压力。实现了三维 Bresenham 算法，并参与 Zaichang 3D 扫描软件的开发。"
  usc-cs:
    title: 计算机科学（游戏方向）学士
    organization: 南加州大学
    shortName: 南加大
    location: 加利福尼亚州洛杉矶
    description: 以最优等成绩（Summa Cum Laude）毕业。游戏开发方向课程包括游戏引擎、游戏物理、沉浸式游戏设计和游戏人工智能。
  usc-math:
    title: 计算与应用数学学士
    organization: 南加州大学
    shortName: 南加大
    location: 加利福尼亚州洛杉矶
    description: 与计算机科学并行的第二专业，课程包括数值分析、机器学习、统计学和线性代数。
  rochester:
    title: 计算机科学学士
    organization: 罗切斯特大学
    shortName: 罗切斯特
    location: 纽约州罗切斯特
    description: 转学至南加州大学之前，修读了计算机科学导论（CSC 171）和数据结构与算法（CSC 172），两门课均以 Java 授课。

projects:
  PSN README Card:
    description: "为 GitHub 个人主页制作的 PlayStation Network 实时奖杯卡片。部署在 Vercel 上的一个小型无服务器函数将奖杯等级、奖杯数量、PS Plus 会员状态和最近游玩的游戏渲染成 SVG，README 可以像普通图片一样嵌入。"
    linkLabels: [在 GitHub 上查看]
  Kazumi TV:
    description: "开源动漫应用 Kazumi 的 Android TV 与 Google TV 移植版。新增完整的遥控器焦点导航、方向键浏览评论、TV 启动器横幅以及网络回退方案，同时保持手机和桌面端的行为不变。"
    linkLabels: [在 GitHub 上查看]
  Lake Minnewaska:
    description: "一款由 30 人团队使用 Unity 开发的钓鱼模拟游戏。我担任玩法与 AI 工程师，负责设计钓鱼机制、基于行为树的鱼类行为 AI 以及核心玩法功能。"
    linkLabels: [在 Steam 上查看]
  Roamy Trip:
    description: "一款集酒店发现、旅行规划和社交功能于一体的全栈应用。通过交互式地图展示全球酒店位置，支持分享点评和添加好友。"

skills:
  Languages: 编程语言
  "Web & Mobile": Web 与移动端
  "Backend, Data & ML": 后端、数据与机器学习
  "Games & Tools": 游戏与工具

