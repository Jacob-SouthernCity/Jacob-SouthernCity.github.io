# Japanese translations, shown at /ja.
# Only translated fields live here; anything missing falls back to the English content.
# Keys are ids from the English files (project and skill groups use their English title).
# The build fails if a key no longer exists in the English content.
# Keep each text on one line: YAML's folded blocks (>-) put spaces between lines.

profile:
  nameVersionLabels: [正式な氏名, 英語名, 中国語名, 日本語名]
  titles: [ソフトウェアエンジニア, ゲーム開発者, 旅人]
  bio: "**Smule** のソフトウェアエンジニアとして、Web・モバイル・プラットフォームを横断して開発しています。**イェール大学でコンピュータサイエンス**の修士号を取得し、南カリフォルニア大学では**ゲーム開発と数学**を学びました。実際に使われるプロダクトを届けることが好きで、ユーザー体験とパフォーマンスを大切にしています。"

experience:
  smule:
    title: ソフトウェアエンジニア
    description: "Smule の各プロダクトに携わるフルタイムのエンジニアです。smule.com の Web アプリと iOS・Android 版 Smule Sing アプリの機能開発に加え、それを支えるバックエンドサービスも担当しています。"
  smule-intern:
    title: 機械学習エンジニア（インターン）
    description: "機械学習エンジニアのインターンとして Smule に参加し、その後フルタイムのソフトウェアエンジニアになりました。"
  vestmark:
    title: アソシエイトソフトウェアエンジニア
    location: マサチューセッツ州ウェイクフィールド
    description: "Vestmark の資産運用プラットフォーム VestmarkONE で、ポートフォリオのリバランスと関連機能のバックエンド API を開発しました。"
  yale:
    title: コンピュータサイエンス修士
    organization: イェール大学
    shortName: イェール
    location: コネチカット州ニューヘイブン
    description: "分散システムの構築、データベースシステム、フルスタック Web プログラミング、ユーザーインターフェースデザインなどを履修しました。"
  ebaotech:
    title: ソフトウェアエンジニア（インターン）
    location: 上海
    description: "LLM を使ったプログラミング言語翻訳のパイプラインを設計しました。PyTorch と Hugging Face で ChatGLM v2 などのモデルをファインチューニングし、保険データベースを構築して AWS SageMaker でモデルを学習させました。"
  nplace:
    title: ソフトウェアエンジニア（インターン）
    location: 上海
    description: "データセンサーコンバーター向けに適応的なダウンサンプリングを開発し、精度を保ちながらスレッドの負荷を減らしました。3D の Bresenham アルゴリズムを実装し、Zaichang 3D スキャンソフトウェアの開発に参加しました。"
  usc-cs:
    title: コンピュータサイエンス（ゲーム）学士
    organization: 南カリフォルニア大学
    location: カリフォルニア州ロサンゼルス
    description: "最優等（Summa Cum Laude）で卒業。ゲームエンジン、ゲーム物理、イマーシブゲームデザイン、ゲーム AI などゲーム開発の科目を履修しました。"
  usc-math:
    title: 計算・応用数学学士
    organization: 南カリフォルニア大学
    location: カリフォルニア州ロサンゼルス
    description: "コンピュータサイエンスと並ぶ第二専攻として、数値解析、機械学習、統計学、線形代数を履修しました。"
  rochester:
    title: コンピュータサイエンス学士
    organization: ロチェスター大学
    shortName: ロチェスター
    location: ニューヨーク州ロチェスター
    description: "USC に編入する前に、どちらも Java で教えられるコンピュータサイエンス入門（CSC 171）とデータ構造とアルゴリズム（CSC 172）を履修しました。"

projects:
  PSN README Card:
    description: "GitHub プロフィール用の PlayStation Network トロフィーカードです。Vercel 上の小さなサーバーレス関数が、トロフィーレベル、トロフィー数、PS Plus の加入状況、最近遊んだゲームを SVG として描画し、README に画像と同じように埋め込めます。"
    linkLabels: [GitHub で見る]
  Kazumi TV:
    description: "オープンソースのアニメアプリ Kazumi を Android TV と Google TV に移植しました。リモコンでのフォーカス操作、十字キーでのコメント閲覧、TV ランチャー用バナー、ネットワークのフォールバックを追加し、スマートフォンとデスクトップでの動作はそのままにしています。"
    linkLabels: [GitHub で見る]
  Lake Minnewaska:
    description: "30 人のチームで Unity を使って開発した釣りシミュレーションゲームです。ゲームプレイと AI のエンジニアとして、釣りのメカニクス、ビヘイビアツリーによる魚の行動 AI、主要なゲームプレイ機能を設計しました。"
    linkLabels: [Steam で見る]
  Roamy Trip:
    description: "ホテル探しと旅行計画にソーシャル機能を組み合わせたフルスタックアプリです。世界中のホテルの場所をインタラクティブな地図で表示し、レビューの共有や友達とのつながりに対応しています。"

skills:
  Languages: プログラミング言語
  "Web & Mobile": Web とモバイル
  "Backend, Data & ML": バックエンド・データ・機械学習
  "Games & Tools": ゲームとツール

